<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>واجهة الدردشة المتقدمة | CyberAI OS</title>
<link href="style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style>
    /* Chat Interface Specific Styles */
    .chat-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    .chat-sidebar {
      width: 280px;
      background-color: var(--background-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-normal);
    }
    
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-header {
      padding: var(--spacing-md) var(--spacing-lg);
      background-color: var(--background-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .model-info {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    
    .model-name {
      font-size: 0.9rem;
      color: var(--muted);
    }
    
    .connection-status {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .status-online {
      background-color: var(--accent);
    }
    
    .status-offline {
      background-color: var(--primary);
    }
    
    .chat-messages {
      flex: 1;
      padding: var(--spacing-lg);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
      background-color: var(--background);
    }
    
    .message {
      display: flex;
      max-width: 80%;
      animation: fadeIn 0.3s ease-out;
    }
    
    .user-message {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    
    .bot-message {
      align-self: flex-start;
    }
    
    .thinking-message {
      align-self: flex-start;
      opacity: 0.7;
    }
    
    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .user-message .message-avatar {
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
    }
    
    .message-content {
      background-color: var(--card-bg);
      padding: var(--spacing-md);
      border-radius: var(--radius-lg);
      position: relative;
      margin: 0 var(--spacing-md);
      border: 1px solid var(--border);
    }
    
    .user-message .message-content {
      background-color: rgba(255, 0, 51, 0.1);
      border: 1px solid rgba(255, 0, 51, 0.2);
    }
    
    .thinking-message .message-content {
      background-color: rgba(30, 30, 30, 0.5);
      border: 1px solid var(--border);
      font-style: italic;
    }
    
    .message-time {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: var(--spacing-sm);
      text-align: left;
    }
    
    .search-result {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-top: var(--spacing-sm);
      font-size: 0.9rem;
    }
    
    .search-result h4 {
      margin-top: 0;
      margin-bottom: var(--spacing-sm);
      color: var(--primary);
    }
    
    .search-result p {
      margin: 0;
      color: var(--muted);
    }
    
    .search-result .source {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: var(--spacing-sm);
    }
    
    .chat-input {
      padding: var(--spacing-lg);
      background-color: var(--background-secondary);
      border-top: 1px solid var(--border);
    }
    
    .input-container {
      display: flex;
      align-items: center;
      background-color: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: var(--spacing-sm) var(--spacing-md);
      transition: border-color var(--transition-normal);
    }
    
    .input-container:focus-within {
      border-color: var(--primary);
    }
    
    .input-container input {
      flex: 1;
      background: none;
      border: none;
      color: var(--foreground);
      padding: var(--spacing-md);
      outline: none;
      font-family: var(--font-family);
    }
    
    .send-button {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--transition-normal), transform var(--transition-normal);
    }
    
    .send-button:hover {
      background-color: var(--primary-hover);
      transform: scale(1.05);
    }
    
    .send-button:disabled {
      background-color: var(--muted);
      cursor: not-allowed;
      transform: none;
    }
    
    .chat-options {
      display: flex;
      justify-content: center;
      gap: var(--spacing-md);
      margin-top: var(--spacing-md);
    }
    
    .option-button {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--foreground);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }
    
    .option-button:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: var(--primary);
    }
    
    .option-button i {
      font-size: 1.2rem;
    }
    
    .sidebar-header {
      padding: var(--spacing-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
    }
    
    .sidebar-section {
      margin-bottom: var(--spacing-lg);
    }
    
    .sidebar-section-title {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-xs);
      border-bottom: 1px solid var(--border);
    }
    
    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .conversation-item {
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--transition-normal);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .conversation-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    
    .conversation-item.active {
      background-color: rgba(255, 0, 51, 0.1);
    }
    
    .conversation-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    
    .conversation-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .sidebar-footer {
      padding: var(--spacing-md);
      border-top: 1px solid var(--border);
    }
    
    .api-key-info {
      margin-bottom: var(--spacing-md);
    }
    
    .api-key-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: var(--spacing-xs);
    }
    
    .api-key-value {
      font-family: monospace;
      background-color: rgba(0, 0, 0, 0.2);
      padding: var(--spacing-sm);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: var(--spacing-sm);
    }
    
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary);
      display: inline-block;
      opacity: 0.6;
    }
    
    .typing-indicator span:nth-child(1) {
      animation: pulse 1s infinite;
    }
    
    .typing-indicator span:nth-child(2) {
      animation: pulse 1s infinite 0.2s;
    }
    
    .typing-indicator span:nth-child(3) {
      animation: pulse 1s infinite 0.4s;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: var(--spacing-2xl);
    }
    
    .empty-state .logo {
      width: 100px;
      height: 100px;
      margin-bottom: var(--spacing-2xl);
      opacity: 0.5;
    }
    
    .empty-state h3 {
      margin-bottom: var(--spacing-md);
      font-size: 1.5rem;
    }
    
    .empty-state p {
      margin-bottom: var(--spacing-2xl);
      max-width: 600px;
    }
    
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-md);
    }
    
    .suggestion {
      background-color: rgba(30, 30, 30, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-sm) var(--spacing-md);
      cursor: pointer;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }
    
    .suggestion:hover {
      background-color: rgba(255, 0, 51, 0.1);
      border-color: var(--primary);
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      .chat-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        z-index: 100;
        transform: translateX(100%);
      }
      
      .chat-sidebar.active {
        transform: translateX(0);
      }
      
      .message {
        max-width: 90%;
      }
      
      .chat-options {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
