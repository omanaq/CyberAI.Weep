
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberAI Weep - Preview</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .button-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .btn-grok {
      background-color: #1f1f1f;
      border: 1px solid #333;
      border-radius: 12px;
      color: white;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      transition: all 0.2s ease-in-out;
    }
    .btn-grok:hover {
      background-color: #292929;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>كيف يمكنني مساعدتك؟</h1>
  <div class="button-grid">
    <button class="btn-grok">إنشاء صورة</button>
    <button class="btn-grok">تحليل البيانات</button>
    <button class="btn-grok">احصل على نصائح</button>
    <button class="btn-grok">ساعدني في الكتابة</button>
    <button class="btn-grok">لخص النص</button>
    <button class="btn-grok">التعليمات البرمجية</button>
    <button class="btn-grok">تحليل الصور</button>
    <button class="btn-grok">اقترح أفكارًا</button>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
